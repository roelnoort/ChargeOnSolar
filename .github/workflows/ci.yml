name: CI

# Runs the repo's own checks on every pull request and every push to main:
# Biome, typecheck in every package, the Vitest suite and the migration drift
# check. All four are `pnpm check`, the same command you run locally. It also
# runs shellcheck on every shell script (`pnpm lint:shell`), which is kept out
# of `pnpm check` because it needs the shellcheck binary; CI installs a pinned
# release below.
#
# The pre-commit hook runs only lint and typecheck, and can be skipped. This
# workflow is what makes a PR show a red or green check on GitHub, for agent
# PRs as well: the factory opens and pushes them with FACTORY_PAT, and pushes
# made with a PAT do start workflows.

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, migration drift
        run: pnpm check

      # The runner's preinstalled shellcheck is older than the one developers
      # get from Homebrew, and versions disagree on findings. Pin the release
      # and check its SHA-256.
      - name: Install shellcheck 0.11.0
        run: |
          curl -sSfLo "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Shellcheck every shell script
        run: pnpm lint:shell
