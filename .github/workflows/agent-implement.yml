name: Agent — Implement A Ticket

# Ticket in, draft pull request out. See docs/agents/factory.md#implement.
#
# WHAT TRIGGERS IT
#   Someone puts the `agent:implement` label on an issue. That is the whole
#   interface. No comment, no trigger phrase, no @mention: one label.
#
#   agent-implement-spec.yml also calls it, as a reusable workflow, for the
#   next ticket in a spec's queue. It passes `issue_number` and
#   `spec_number`, and closes the ticket itself once this has succeeded.
#
# WHAT IT DOES
#   Checks the repo out, gives an agent the ticket and the repo's own
#   verification checks, and opens a DRAFT pull request with whatever the
#   agent committed. Draft, always: the merge stays a human's.
#
#   Then it hands that pull request to the reviewer: it adds `agent:review`,
#   which starts agent-review.yml. The reviewer marks the PR ready once its
#   verdict is posted.
#
#   Every run pushes to a branch of its own, `agent/issue-<n>-<run id>`. A
#   retry never pushes onto the branch an earlier run left behind, so nothing
#   is there to reject the push and no run's work is lost. Two runs on one
#   ticket means two pull requests; close the one you do not want.
#
#   The agent itself is a Sandcastle script:
#   .sandcastle/agent-workflows/implement/implement.ts, with its prompt next
#   to it in prompt.md.
#
#   No real devices. The agent verifies against the fakes in the test harness,
#   and no device or vendor credentials exist in Actions.
#
# THE JOBS
#     prepare   runs no agent and checks nothing out. It moves the labels,
#               reads the ticket, and hands it on as a file.
#     build     checks out, installs, and runs the agent. It holds no
#               FACTORY_PAT. It hands on the agent's commits as a git bundle,
#               with the PR body and the screenshots.
#     publish   runs no agent and checks nothing out. It pushes the commits
#               in the bundle, opens the draft PR, and adds `agent:review`.
#     finish    marks the ticket `agent:blocked` on failure, reports back on
#               it, and always takes `agent:in-progress` off.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN: the agent's auth token. To change the
#     agent or how it is billed, see
#     .sandcastle/agent-workflows/shared/common.ts.
#   secrets.FACTORY_PAT: a fine-grained PAT on this repository with Issues,
#     Pull requests, Contents, Workflows and Actions, all read/write. Every
#     call to GitHub uses it, from prepare, publish and finish only: reading
#     the ticket, pushing, opening the pull request, commenting. One token for
#     the whole factory, because some hops need it anyway: by default the
#     built-in GITHUB_TOKEN cannot open a pull request at all, and a label it
#     applies starts no workflow. That second hop is `agent:review`, the label
#     that starts the reviewer.
#   secrets.GITHUB_TOKEN: supplied by Actions, and used for one thing: the
#     build job's checkout. Scoped per job below.
#   The `agent:implement` label. No workflow can create the label that starts
#     it; scripts/setup-factory.sh creates it once.
#
# WHERE THE TOKENS GO
#   The job split is what keeps the PAT from the agent. The build job never
#   mentions FACTORY_PAT, not even in a step
#   that runs before the agent. A job is handed only the secrets it uses, so
#   the machine the agent runs on never holds the PAT, and an agent that took
#   that machine over (it can use `sudo`, and read the runner's memory) would
#   find no key to steal. #43 checked this on a throwaway workflow: the PAT
#   was in the memory of the job that used it, and nowhere in the job that
#   did not.
#
#   The jobs that hold the PAT run nothing the agent wrote. They check
#   nothing out: the commits arrive as a git bundle, which publish fetches
#   into an empty bare repository, with no hooks, and pushes from there. The
#   PR body and the screenshots are read as text and files, never run.
#
# WHO COMMITS
#   The agent does, and the repo's own pre-commit hook runs on every commit it
#   makes: `pnpm install` installs it, through husky's `prepare` script,
#   exactly as it does on your machine. When the hook rejects a commit, the
#   agent reads the failure, fixes its work and commits again. The hook is
#   code from the repo, so it runs only in the build job, where there is no
#   token.
#
# A CAUTION THAT COMES WITH IT
#   `issues: labeled` fires on issues, which cannot come from a fork. Do not
#   copy this trigger onto `pull_request_target`: that runs fork code with
#   this job's secrets, and a fork can label nothing but can change the code
#   the agent runs.

on:
  issues:
    types: [labeled]
  workflow_call:
    inputs:
      issue_number:
        description: The ticket to build.
        type: number
        required: true
      spec_number:
        description: The spec whose queue the ticket came from. Only changes how the status comment says to retry.
        type: number
        required: true
    outputs:
      pr_url:
        description: The draft pull request, once it is open.
        value: ${{ jobs.publish.outputs.url }}
    # Passed by name, not inherited, so it is plain which secrets come in.
    # As below, only the jobs that mention one are handed it.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      FACTORY_PAT:
        required: true

# One run per ticket, never cancelled. A second `agent:implement` on the same
# issue waits for the first run to finish rather than building the ticket
# twice at once, and so does a queue run for that ticket. Every other label,
# including the ones this run applies itself (`agent:in-progress`,
# `agent:blocked`), gets a throwaway group of its own, so it can never
# replace a waiting retry. When called, `github.event` is the caller's event,
# so the inputs are read first.
concurrency:
  group: ${{ inputs.issue_number && format('agent-implement-{0}', inputs.issue_number) || (github.event.label.name == 'agent:implement' && format('agent-implement-{0}', github.event.issue.number) || format('ignore-{0}', github.run_id)) }}
  cancel-in-progress: false

# Nothing by default. Only the build job asks for something: the read its
# checkout needs. Everything that writes goes through FACTORY_PAT, whose
# reach is set where you created it, not here.
permissions: {}

env:
  GH_REPO: ${{ github.repository }}
  ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
  # Empty unless agent-implement-spec.yml called this.
  SPEC_NUMBER: ${{ inputs.spec_number }}
  # The run id makes the branch new on every run. See WHAT IT DOES.
  BRANCH: agent/issue-${{ inputs.issue_number || github.event.issue.number }}-${{ github.run_id }}
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  prepare:
    # Every other label on every other issue stops here, for free. A call
    # from agent-implement-spec.yml always goes on.
    if: inputs.issue_number || github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No checkout and no agent. It reads the issue and moves labels with
    # FACTORY_PAT, which is why it is a job of its own: see WHERE THE TOKENS
    # GO.
    permissions: {}

    env:
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}

    steps:
      - name: Transition labels
        # The trigger comes off, so putting it back on is how you retry.
        # `agent:in-progress` goes on until the run ends, however it ends.
        run: |
          # The state labels may not exist yet. Existing ones are left as they are.
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          gh label create "agent:blocked" --color B60205 \
            --description "An agent run failed here. Its comment says how to retry" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Read the ticket
        run: |
          set -euo pipefail
          # A comment reaches the agent only when the person who wrote it has
          # write access to this repo. The factory posts with FACTORY_PAT, so
          # its comments are yours, and they pass. Explore's findings should:
          # they are what the implementer most needs to see. The factory's
          # status lines should not ("Building", "run failed"), so every one
          # of them carries a hidden `<!-- factory:status -->` and is dropped
          # here.
          mkdir -p /tmp/ticket
          gh issue view "$ISSUE_NUMBER" --json number,title,body,labels,comments \
            | jq '.comments |= map(select(
                (.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))
                and (.body | contains("<!-- factory:status -->") | not)))' \
            > /tmp/ticket.json
          jq -r '
            "# " + .title + "\n\n" + .body
            + (if (.comments | length) > 0
               then "\n\n## Comments\n"
                 + ([.comments[] | "\n### " + .author.login + " (" + .createdAt + ")\n\n" + .body + "\n"] | join(""))
               else "" end)
          ' /tmp/ticket.json > /tmp/ticket/ticket.md
          cat /tmp/ticket/ticket.md

      - name: Hand the ticket to the build job
        uses: actions/upload-artifact@v4
        with:
          name: implement-ticket
          path: /tmp/ticket/ticket.md

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # No FACTORY_PAT anywhere in this job. Keep it that way.
    permissions:
      contents: read # the checkout

    env:
      # Claude Code and agent-browser. Only the agent's step puts this on its
      # PATH.
      TOOLS_PREFIX: /home/runner/.factory-tools

    steps:
      - name: Take the ticket from the prepare job
        # The agent reads /tmp/ticket.md.
        uses: actions/download-artifact@v4
        with:
          name: implement-ticket
          path: /tmp

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the bundle needs nothing the publish job lacks.
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (version from .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Week of the year
        # Refreshes the tools cache weekly, so Claude Code does not go stale.
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Restore and save are split so the cache is saved right after the
      # install, before the agent runs. A plain actions/cache saves at the end
      # of the job, and would keep anything the agent left in these
      # directories for every later run that week.
      - name: Restore Claude Code and agent-browser
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TOOLS_PREFIX }}
            ~/.agent-browser
          key: factory-tools-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Install Claude Code and agent-browser
        if: steps.tools-cache.outputs.cache-hit != 'true'
        # The runner image ships Chrome, so Chrome's system libraries are
        # already there and `--with-deps` is not needed.
        run: |
          set -euo pipefail
          npm install -g --prefix "$TOOLS_PREFIX" @anthropic-ai/claude-code agent-browser
          "$TOOLS_PREFIX/bin/agent-browser" install

      - name: Save Claude Code and agent-browser
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TOOLS_PREFIX }}
            ~/.agent-browser
          key: factory-tools-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Check the tools run
        run: |
          "$TOOLS_PREFIX/bin/claude" --version
          "$TOOLS_PREFIX/bin/agent-browser" --version

      - name: Open the branch
        run: |
          set -euo pipefail
          git config user.name "agent-factory[bot]"
          git config user.email "agent-factory[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # `pnpm install` ran husky, which points git at .husky/_. If it did
          # not, the agent's commits would skip the hook without anyone
          # noticing.
          if [ "$(git config core.hooksPath)" != ".husky/_" ]; then
            echo "::error::The pre-commit hook is not installed (core.hooksPath is '$(git config core.hooksPath)')."
            exit 1
          fi

      - name: Build the ticket
        # No GitHub token here, and no device or vendor credentials anywhere.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PATH="$TOOLS_PREFIX/bin:$PATH" \
            pnpm exec tsx .sandcastle/agent-workflows/implement/implement.ts

      - name: Check the agent committed
        # No commit means no pull request, and the run goes red rather than
        # green-and-empty. Where the agent started is the commit this run is
        # for. Publish checks the commits again, from the bundle.
        run: |
          set -euo pipefail
          commits=$(git rev-list --count "$GITHUB_SHA..HEAD")
          if [ "$commits" -eq 0 ]; then
            echo "::error::The agent finished without committing anything. Nothing to open a PR for."
            git status --short
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The agent left uncommitted changes. The PR would not contain them."
            git status --short
            exit 1
          fi
          git log --oneline "$GITHUB_SHA..HEAD"

      - name: Bundle the commits
        # The whole history up to HEAD, so the bundle stands alone: publish
        # fetches it into an empty repository.
        run: |
          set -euo pipefail
          mkdir -p /tmp/handoff
          git bundle create /tmp/handoff/agent.bundle HEAD
          [ -s /tmp/pr-body.md ] && cp /tmp/pr-body.md /tmp/handoff/pr-body.md
          shopt -s nullglob
          pngs=(/tmp/evidence/*.png)
          if [ "${#pngs[@]}" -gt 0 ]; then
            mkdir -p /tmp/handoff/evidence
            cp "${pngs[@]}" /tmp/handoff/evidence/
          fi
          ls -R /tmp/handoff

      - name: Hand the commits to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: implement-handoff
          path: /tmp/handoff

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No checkout and no agent, so the GITHUB_TOKEN gets nothing. This job
    # writes with FACTORY_PAT.
    permissions: {}

    outputs:
      url: ${{ steps.pr.outputs.url }}

    env:
      # On the job, which is fine here: nothing in it runs code from an agent
      # or from a checkout. It reads git objects, a Markdown file and PNGs.
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}

    steps:
      - name: Take the commits from the build job
        uses: actions/download-artifact@v4
        with:
          name: implement-handoff
          path: /tmp/handoff

      - name: Push
        run: |
          set -euo pipefail
          # An empty bare repository: no working tree, and with no template,
          # no hooks directory. Hooks are switched off on top of that, so
          # nothing the agent wrote runs while the token is here.
          git init -q --bare --template= /tmp/repo
          git() { command git -C /tmp/repo -c core.hooksPath=/dev/null "$@"; }
          git fetch -q /tmp/handoff/agent.bundle "HEAD:refs/heads/agent"
          # The bundle came from the machine the agent ran on, so it is
          # checked again here: the agent's work has to sit on top of the
          # commit this run is for, and add at least one commit to it.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/heads/agent; then
            echo "::error::The bundle does not build on $GITHUB_SHA. Refusing to push it."
            exit 1
          fi
          if [ "$(git rev-list --count "$GITHUB_SHA..refs/heads/agent")" -eq 0 ]; then
            echo "::error::The bundle holds no new commits. Nothing to open a PR for."
            exit 1
          fi
          git log --oneline "$GITHUB_SHA..refs/heads/agent"
          # Never forced. The branch is new, so nothing is there to reject it.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/${GH_REPO}.git" "refs/heads/agent:refs/heads/${BRANCH}"

      - name: Open the draft pull request
        id: pr
        env:
          # By default the built-in GITHUB_TOKEN is not allowed to open a pull
          # request. `--attach` uploads the agent's screenshots and swaps each
          # matching /tmp/evidence path in the body for its URL. It needs a
          # PAT too: GITHUB_TOKEN is rejected.
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A scheduled caller's event carries no repository to read it from.
          base="${BASE_BRANCH:-$(gh repo view "$GH_REPO" --json defaultBranchRef --jq .defaultBranchRef.name)}"
          title="$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)"
          body_file=/tmp/pr-body.md
          if [ -s /tmp/handoff/pr-body.md ]; then
            cp /tmp/handoff/pr-body.md "$body_file"
          else
            echo "Built by the implementer workflow." > "$body_file"
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Closes #${ISSUE_NUMBER}. Built unattended by [this run](${RUN_URL})."
            echo "The reviewer has been asked to read it. It stays a draft until the verdict is posted."
          } >> "$body_file"

          # The body names each screenshot by the path the agent saved it to,
          # and --attach matches on that path, so they go back there.
          shopt -s nullglob
          mkdir -p /tmp/evidence
          attach=()
          for png in /tmp/handoff/evidence/*.png; do
            cp "$png" /tmp/evidence/
            attach+=(--attach "/tmp/evidence/$(basename "$png")")
          done

          url="$(gh pr create \
            --draft \
            --base "$base" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file "$body_file" \
            "${attach[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Hand the pull request to the reviewer
        # agent-review.yml triggers on `pull_request: [labeled]`, and a label
        # applied with the built-in token starts no workflow. With
        # GITHUB_TOKEN the label lands, the run goes green, and the reviewer
        # never wakes.
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          # No `|| true` here, on purpose. If this fails, the chain has
          # stopped at its last hop, and a red run says so. A green run over
          # a chain that stopped says nothing.
          gh pr edit "$PR_URL" --add-label "agent:review"

  # However the jobs above ended, this one closes the run out.
  finish:
    needs: [prepare, build, publish]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No checkout and no agent. It writes labels and comments with FACTORY_PAT.
    permissions: {}

    env:
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
      # success, failure or cancelled: what the run as a whole came to.
      RUN_STATUS: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || (contains(needs.*.result, 'failure') && 'failure' || 'success') }}
      PR_URL: ${{ needs.publish.outputs.url }}

    steps:
      - name: Mark blocked on failure
        # A timeout or a cancelled run counts too: neither built the ticket.
        if: env.RUN_STATUS != 'success'
        run: gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true

      - name: Report back on the ticket
        if: always()
        run: |
          where=""
          [ -n "$PR_URL" ] && where=" Pull request: ${PR_URL}, from \`${BRANCH}\`."
          retry=""
          if [ "$RUN_STATUS" != "success" ]; then
            if [ -n "$PR_URL" ]; then
              # The pull request exists. Only the hand-off failed, so a new
              # implement run would build a second pull request.
              retry=" The pull request was not handed to the reviewer. Add \`agent:review\` to it to have it reviewed."
            elif [ -n "$SPEC_NUMBER" ]; then
              # The queue skips a ticket that is `agent:blocked`.
              retry=" The queue for #${SPEC_NUMBER} skips this ticket while it is \`agent:blocked\`. Take that label off and start implement-spec again to retry it in the queue, or re-add \`agent:implement\` to build it on its own."
            else
              retry=" Re-add \`agent:implement\` to retry."
            fi
          fi
          # Tagged, so the next run on this ticket leaves it out of the ticket.
          gh issue comment "$ISSUE_NUMBER" --body \
            "Implementer run **${RUN_STATUS}** — [logs](${RUN_URL}).${where}${retry} <!-- factory:status -->"

      - name: Always remove in-progress
        if: always()
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
