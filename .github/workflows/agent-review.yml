name: Agent — Review A Pull Request

# A review with no memory of the build. See docs/agents/factory.md#review.
#
# WHAT TRIGGERS IT
#   Someone puts the `agent:review` label on a pull request. The implementer
#   does this itself for every pull request it opens, and so does
#   agent-implement-spec.yml. Add it by hand to review again, or when that
#   hand-off failed.
#
# THE POINT OF THIS FILE: IT IS MEMORY-LESS
#   This workflow shares nothing with the implementer run. No session, no
#   transcript, no scratch files, no "as we discussed". It starts from a cold
#   checkout and three primary sources it reads itself:
#
#     1. the diff              — what actually changed
#     2. CODING_STANDARDS.md   — the rules, at the repo root
#     3. the originating issue — what was asked for, read from the ticket the
#                                PR closes, not from the PR description
#
#   That independence is the whole value. An implementer that has argued
#   itself into a shortcut will argue a reviewer that shares its context into
#   the same shortcut. A reviewer that has never seen the argument cannot be.
#   If you find yourself wanting to pass context from the build run into this
#   one, that is the instinct to resist.
#
#   The agent itself is a Sandcastle script:
#   .sandcastle/agent-workflows/review/review.ts, with its prompt next to it
#   in prompt.md. The prompt hands it the repo's own code-review skill.
#
#   No real devices. The agent verifies against the fakes in the test harness,
#   and no device or vendor credentials exist in Actions.
#
# IT FIXES WHAT IT CAN
#   A review that only lists findings hands the work to a human. This one
#   fixes every finding it can, as commits on the PR's branch, and leaves the
#   rest as inline comments on their file and line. The workflow pushes the
#   commits, never forced. If someone pushed to the branch during the run,
#   GitHub rejects the push, and the commits go to a new branch,
#   `<pr branch>-<run id>`, opened as a draft PR against the same base. The
#   original PR gets `agent:blocked`, because a person has to pick which to
#   keep.
#
# HOW IT ENDS: THE PR GOES READY
#   The implementer opens every PR as a draft, and the draft means "nobody
#   has read this yet". Once the verdict is posted, somebody has. So publish
#   ends by marking the PR ready for review, on a fail as well as a pass.
#   Ready is not approved. A failing verdict is for a human to read, and the
#   merge is still a human's.
#
# THE JOBS
#     prepare   runs no agent and checks nothing out. It moves the labels,
#               collects the spec, and hands it on as a file.
#     review    checks out the PR's head, installs, and runs the agent. It
#               holds no FACTORY_PAT. It hands on the agent's commits as a
#               git bundle, with the verdict, the inline comments and the
#               screenshots.
#     publish   runs no agent and checks nothing out. It pushes the fixes
#               from the bundle (or to the fallback branch and PR), posts
#               the verdict and the inline comments, and marks the PR ready.
#     finish    marks the PR `agent:blocked` on failure or a rejected push,
#               reports a failure that came after the verdict, and always
#               takes `agent:in-progress` off.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN: the agent's auth token. To change the
#     agent or how it is billed, see
#     .sandcastle/agent-workflows/shared/common.ts.
#   secrets.FACTORY_PAT: the factory's one token, used from prepare, publish
#     and finish only. It reads the PR and the ticket, pushes the review's
#     commits, opens a fallback PR, posts the verdict and the inline
#     comments, and marks the PR ready. The built-in GITHUB_TOKEN could not
#     open the fallback PR, and the labels it applies would start no
#     workflow.
#   secrets.GITHUB_TOKEN: supplied by Actions, used only for the review job's
#     checkout. Scoped per job below.
#   The `agent:review` label. No workflow can create the label that starts
#     it; scripts/setup-factory.sh creates it once.
#
# WHERE THE TOKENS GO
#   As in agent-implement.yml, the job split does the work: the review
#   job never mentions FACTORY_PAT, so the machine the agent runs on, with
#   the PR's code checked out, never holds it. A job is handed only the
#   secrets it uses (#43 checked this). The jobs that hold the PAT run
#   nothing the PR or the agent wrote: they check nothing out, push from the
#   bundle through an empty bare repository with hooks off, and read the
#   verdict and the comments as text.
#
#   The other defence is who can reach the agent: same-repo PRs only, and a
#   label only a collaborator can apply.
#
# A CAUTION THAT COMES WITH IT
#   `pull_request` (not `pull_request_target`), so a PR from a fork would run
#   with a read-only token and no secrets. The run skips fork PRs outright
#   rather than failing at its first `gh` call. Reviewing a stranger's code
#   with a writable token is how a factory gets robbed. Do not switch this to
#   `pull_request_target`.

on:
  pull_request:
    types: [labeled]

# One review per PR, never cancelled: a cancelled review would lose the
# commits it made. A fresh `agent:review` waits for the one running. Every
# other label, including the ones this run applies itself, gets a throwaway
# group of its own, so it can never replace a waiting retry.
concurrency:
  group: ${{ github.event.label.name == 'agent:review' && format('agent-review-{0}', github.event.pull_request.number) || format('ignore-{0}', github.run_id) }}
  cancel-in-progress: false

# Nothing by default. Only the review job asks for something: the read its
# checkout needs. Everything that writes goes through FACTORY_PAT.
permissions: {}

env:
  GH_REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BRANCH: ${{ github.event.pull_request.head.ref }}
  # Where the fixes go if the push to BRANCH is rejected. New every run.
  FALLBACK_BRANCH: ${{ github.event.pull_request.head.ref }}-${{ github.run_id }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  prepare:
    # Every other label stops here, for free. So does a PR from a fork.
    if: >-
      github.event.label.name == 'agent:review'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No checkout and no agent. It reads the PR and the ticket and moves
    # labels with FACTORY_PAT, which is why it is a job of its own.
    permissions: {}

    env:
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}

    steps:
      - name: Transition labels
        # The trigger comes off, so putting it back on is how you retry.
        # `agent:in-progress` goes on until the run ends, however it ends.
        run: |
          # The state labels may not exist yet. Existing ones are left as they are.
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          gh label create "agent:blocked" --color B60205 \
            --description "An agent run failed here. Its comment says how to retry" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Collect the spec
        run: |
          set -euo pipefail
          # The other two sources need no step. The diff the agent takes
          # itself, against `origin/$BASE_REF` three-dot, so anything pushed
          # to the base since the PR opened is not blamed on the PR. The
          # standards are CODING_STANDARDS.md, in the checkout.
          #
          # The spec is whatever issue this PR closes, found in the PR body:
          # the one thing here read from the PR. With no `Closes #n`, the Spec
          # axis reports "no spec available" rather than inventing one. As
          # with the implementer's ticket, only comments from people with
          # write access get in, and the factory's status comments do not.
          mkdir -p /tmp/spec
          gh pr view "$PR_NUMBER" --json body --jq .body > /tmp/pr-body.md
          issue=$(grep -oiE '(close[sd]?|fix(es|ed)?|resolve[sd]?) #[0-9]+' /tmp/pr-body.md \
            | head -n1 | grep -oE '[0-9]+' || true)
          if [ -n "$issue" ]; then
            gh issue view "$issue" --json number,title,body,comments \
              | jq -r '
                  .comments |= map(select(
                    (.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))
                    and (.body | contains("<!-- factory:status -->") | not)))
                  | "# Ticket #" + (.number | tostring) + ": " + .title + "\n\n" + .body
                    + (if (.comments | length) > 0
                       then "\n\n## Comments\n"
                         + ([.comments[] | "\n### " + .author.login + " (" + .createdAt + ")\n\n" + .body + "\n"] | join(""))
                       else "" end)
                ' > /tmp/spec/review-spec.md
          else
            echo "No spec available: this PR does not say which ticket it closes." \
              > /tmp/spec/review-spec.md
          fi
          cat /tmp/spec/review-spec.md

      - name: Hand the spec to the review job
        uses: actions/upload-artifact@v4
        with:
          name: review-spec
          path: /tmp/spec/review-spec.md

  review:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No FACTORY_PAT anywhere in this job. Keep it that way.
    permissions:
      contents: read # the checkout

    env:
      # Claude Code and agent-browser. Only the agent's step puts this on its
      # PATH.
      TOOLS_PREFIX: /home/runner/.factory-tools

    steps:
      - name: Take the spec from the prepare job
        # The agent reads /tmp/review-spec.md.
        uses: actions/download-artifact@v4
        with:
          name: review-spec
          path: /tmp

      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          # The PR's head, so the review's fixes are commits on top of it.
          # Full history: the review diffs it against the base, and the
          # bundle needs nothing the publish job lacks.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (version from .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Week of the year
        # Refreshes the tools cache weekly, so Claude Code does not go stale.
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Restore and save are split so the cache is saved right after the
      # install, before the agent runs. Same key as agent-implement.yml, so
      # the two share one cache.
      - name: Restore Claude Code and agent-browser
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TOOLS_PREFIX }}
            ~/.agent-browser
          key: factory-tools-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Install Claude Code and agent-browser
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm install -g --prefix "$TOOLS_PREFIX" @anthropic-ai/claude-code agent-browser
          "$TOOLS_PREFIX/bin/agent-browser" install

      - name: Save Claude Code and agent-browser
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TOOLS_PREFIX }}
            ~/.agent-browser
          key: factory-tools-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Check the tools run
        run: |
          "$TOOLS_PREFIX/bin/claude" --version
          "$TOOLS_PREFIX/bin/agent-browser" --version

      - name: Open the branch
        run: |
          set -euo pipefail
          git config user.name "agent-factory[bot]"
          git config user.email "agent-factory[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # `pnpm install` ran husky, which points git at .husky/_. If it did
          # not, the agent's commits would skip the hook without anyone
          # noticing.
          if [ "$(git config core.hooksPath)" != ".husky/_" ]; then
            echo "::error::The pre-commit hook is not installed (core.hooksPath is '$(git config core.hooksPath)')."
            exit 1
          fi

      - name: Review the pull request
        # No GitHub token here, and no device or vendor credentials anywhere.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          PATH="$TOOLS_PREFIX/bin:$PATH" \
            pnpm exec tsx .sandcastle/agent-workflows/review/review.ts

      - name: Bundle the review's fixes
        # Always: a verdict the agent wrote before it broke still gets
        # posted. Publish pushes the commits only when this job succeeded.
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/handoff
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::The review left uncommitted changes. Only its commits are pushed."
            git status --short
          fi
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "The review made no commits. Nothing to push."
          else
            git log --oneline "$HEAD_SHA..HEAD"
            # The whole history up to HEAD, so the bundle stands alone:
            # publish fetches it into an empty repository.
            git bundle create /tmp/handoff/agent.bundle HEAD
          fi
          [ -s /tmp/review-verdict.md ] && cp /tmp/review-verdict.md /tmp/handoff/
          [ -s "$RUNNER_TEMP/review-comments.json" ] && cp "$RUNNER_TEMP/review-comments.json" /tmp/handoff/
          shopt -s nullglob
          pngs=(/tmp/evidence/*.png)
          if [ "${#pngs[@]}" -gt 0 ]; then
            mkdir -p /tmp/handoff/evidence
            cp "${pngs[@]}" /tmp/handoff/evidence/
          fi
          ls -R /tmp/handoff

      - name: Hand the fixes and the verdict to the publish job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-handoff
          path: /tmp/handoff
          if-no-files-found: ignore

  publish:
    needs: [prepare, review]
    # Always, once the run is for this label: a run that broke anywhere,
    # prepare included, still gets its no-verdict note on the PR. Each step
    # below says what else it needs.
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No checkout and no agent, so the GITHUB_TOKEN gets nothing. This job
    # writes with FACTORY_PAT.
    permissions: {}

    outputs:
      fallback: ${{ steps.push.outputs.fallback }}
      verdict: ${{ steps.verdict.outputs.posted }}

    env:
      # On the job, which is fine here: nothing in it runs code from an
      # agent, the PR or a checkout. It reads git objects, Markdown, JSON and
      # PNGs.
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
      REVIEWED: ${{ needs.review.result == 'success' }}

    steps:
      - name: Take the fixes and the verdict from the review job
        # A pattern, not a name, so a review that broke before uploading
        # anything finds nothing. And never fatal: the no-verdict note below
        # has to go out even then.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: review-handoff
          path: /tmp/handoff
          merge-multiple: true

      - name: Push the review's fixes
        id: push
        if: env.REVIEWED == 'true'
        run: |
          set -euo pipefail
          if [ ! -s /tmp/handoff/agent.bundle ]; then
            echo "The review made no commits. Nothing to push."
            exit 0
          fi
          # An empty bare repository: no working tree, and with no template,
          # no hooks directory. Hooks are switched off on top of that, so
          # nothing the PR or the agent wrote runs while the token is here.
          git init -q --bare --template= /tmp/repo
          git() { command git -C /tmp/repo -c core.hooksPath=/dev/null "$@"; }
          git fetch -q /tmp/handoff/agent.bundle "HEAD:refs/heads/review"
          # The bundle came from the machine the agent ran on, so it is
          # checked again here: the fixes have to sit on top of the head this
          # run reviewed.
          if ! git merge-base --is-ancestor "$HEAD_SHA" refs/heads/review; then
            echo "::error::The bundle does not build on $HEAD_SHA. Refusing to push it."
            exit 1
          fi
          if [ "$(git rev-parse refs/heads/review)" = "$HEAD_SHA" ]; then
            echo "The review made no commits. Nothing to push."
            exit 0
          fi
          git log --oneline "$HEAD_SHA..refs/heads/review"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          push_to() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push "https://github.com/${GH_REPO}.git" "refs/heads/review:refs/heads/$1"
          }
          # Not a force push: if someone pushed to the branch during the run,
          # this is rejected.
          if push_to "$BRANCH"; then
            exit 0
          fi
          # Rejected. Never force it, and never lose the fixes: push them to a
          # branch of their own, which this run's id makes new.
          echo "::warning::The push to $BRANCH was rejected. Pushing the fixes to $FALLBACK_BRANCH instead."
          push_to "$FALLBACK_BRANCH"
          echo "fallback=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request for the rejected push
        id: fallback
        if: steps.push.outputs.fallback == 'true'
        run: |
          set -euo pipefail
          {
            echo "The \`agent:review\` run on #${PR_NUMBER} committed fixes on top of \`${BRANCH}\`,"
            echo "but \`${BRANCH}\` moved during the run and the push was rejected. These are those fixes,"
            echo "so they are not lost. Keep this PR or #${PR_NUMBER}, and close the other."
            echo ""
            echo "Built unattended by [this run](${RUN_URL})."
          } > /tmp/review-fallback.md
          url="$(gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$FALLBACK_BRANCH" \
            --title "$(gh pr view "$PR_NUMBER" --json title --jq .title) (review run ${{ github.run_id }})" \
            --body-file /tmp/review-fallback.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Post the verdict on the pull request
        id: verdict
        if: always()
        env:
          FALLBACK: ${{ steps.push.outputs.fallback }}
          FALLBACK_URL: ${{ steps.fallback.outputs.url }}
        run: |
          set -euo pipefail
          verdict=/tmp/review-verdict.md
          if [ -s /tmp/handoff/review-verdict.md ]; then
            cp /tmp/handoff/review-verdict.md "$verdict"
          else
            # No verdict means the run broke. That comment is a status line,
            # not a review, so it carries the factory's status marker.
            echo "The review run produced no verdict. See the logs. Re-add \`agent:review\` to retry. <!-- factory:status -->" \
              > "$verdict"
          fi
          if [ "$FALLBACK" = "true" ]; then
            {
              echo ""
              echo "The push of this review's fixes to \`$BRANCH\` was **rejected**: the branch moved during this run. Nothing was force-pushed."
              echo "The fixes are on \`$FALLBACK_BRANCH\`${FALLBACK_URL:+, opened as ${FALLBACK_URL}}. Labelled \`agent:blocked\`: keep one of the two PRs."
            } >> "$verdict"
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Reviewed by the review workflow — [logs](${RUN_URL}). This run"
            echo "saw the diff, the standards and the ticket, and nothing else."
          } >> "$verdict"
          # The verdict names each screenshot by the path the agent saved it
          # to, and --attach matches on that path, so they go back there.
          # nullglob: none means no --attach.
          shopt -s nullglob
          mkdir -p /tmp/evidence
          attach=()
          for png in /tmp/handoff/evidence/*.png; do
            cp "$png" /tmp/evidence/
            attach+=(--attach "/tmp/evidence/$(basename "$png")")
          done
          gh pr comment "$PR_NUMBER" --body-file "$verdict" "${attach[@]}"
          # A real verdict carries its own `## Standards:` heading. The
          # no-verdict note above does not, and is not a review.
          if grep -q '^## Standards:' "$verdict"; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post the inline comments
        # One review, event COMMENT, with a comment on each line the agent
        # left a finding on. They go where the fixes went: the fallback PR if
        # the push was rejected. review.ts already dropped every comment
        # outside the diff, because GitHub rejects the whole review for one.
        if: env.REVIEWED == 'true'
        env:
          TARGET: ${{ steps.fallback.outputs.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          review=/tmp/handoff/review-comments.json
          if [ ! -s "$review" ] || [ "$(jq '.comments | length' "$review")" -eq 0 ]; then
            echo "No inline comments: the review fixed or passed everything."
            exit 0
          fi
          gh api --method POST "repos/$GH_REPO/pulls/$TARGET/reviews" \
            --input "$review" --silent

      - name: Mark the pull request ready
        # Not when the review broke: then nobody has read the PR, so it stays
        # a draft. And only when a real verdict was posted. Pass or fail does
        # not matter.
        if: env.REVIEWED == 'true' && steps.verdict.outputs.posted == 'true'
        run: gh pr ready "$PR_NUMBER"

  # However the jobs above ended, this one closes the run out.
  finish:
    needs: [prepare, review, publish]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No checkout and no agent. It writes labels and comments with FACTORY_PAT.
    permissions: {}

    env:
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}

    steps:
      - name: Mark blocked on failure or a rejected push
        # A timeout or a cancelled run counts too: neither finished the
        # review. A rejected push is blocked as well: the fixes are on another
        # branch, and a person has to choose between the two PRs.
        if: env.FAILED == 'true' || needs.publish.outputs.fallback == 'true'
        run: gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true

      - name: Report a failure after the verdict
        # A run that broke before its verdict already said so in the
        # no-verdict note. One that broke after it (the fallback push, the
        # inline comments) has only a verdict that reads as a success.
        if: env.FAILED == 'true' && needs.publish.outputs.verdict == 'true'
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "Review run **failed** after posting its verdict — [logs](${RUN_URL}). The PR stays a draft. Re-add \`agent:review\` to retry. <!-- factory:status -->" \
            || true

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
