name: Agent — Explore The Tickets

# The cheap, read-only run in front of implement. See
# docs/agents/factory.md#explore.
#
# WHAT TRIGGERS IT
#   Someone puts the `agent:explore` label on an issue. The run then ignores
#   which issue that was. It explores EVERY open issue labelled
#   `agent:explore`, together, as one batch.
#
# WHY A BATCH
#   Tickets arrive in clumps, and a clump has duplicates in it: the same bug
#   reported twice, three symptoms of one root cause. One run per ticket reads
#   the same code three times and never notices. One run over the batch reads
#   every ticket first, groups the ones that look related, explores each group
#   once with a subagent, and closes the duplicates onto the oldest ticket.
#
# WHAT IT DOES, AND WHAT IT DOES NOT
#   It reads. It reads the tickets and the code they would touch, and hands
#   back a plan: one entry per ticket, with the comment to post on it. It does
#   not edit a file, open a branch or open a pull request. It does not even
#   post its own comments. There are three jobs:
#
#     explore   runs the agent. The agent holds no GitHub token at all.
#     apply     runs no agent and checks nothing out. It checks the plan, and
#               only then writes.
#     finish    marks what is left `agent:blocked` on failure, and always
#               takes `agent:in-progress` off.
#
#   Read where FACTORY_PAT goes before anything else: it is the enforcement,
#   not the description. In the explore job it goes to one step, the one that
#   lists the batch, which runs before the agent exists and runs nothing but
#   `gh` and `jq`. The job's GITHUB_TOKEN can read the code and nothing else.
#   So the agent has nothing to write with.
#
#   No real devices. The agent explores against the fakes in the test
#   harness, and no device or vendor credentials exist in Actions.
#
# THE PLAN, AND THE CHECK IN FRONT OF IT
#   The plan's shape is .sandcastle/agent-workflows/explore/plan-schema.ts.
#   Before apply writes anything, it runs
#   .sandcastle/agent-workflows/explore/plan-check.ts on it: every issue in
#   the batch exactly once, tags it knows, no empty comment, and every
#   duplicate pointing at a surviving issue in the batch. Any problem refuses
#   the whole plan: nothing is written, the run goes red, and finish marks the
#   batch `agent:blocked`. Apply fetches that one file from this commit with
#   `gh api` and runs it on plain Node, so it still has no checkout and runs
#   nothing the agent could have touched.
#
# AND THEN IT BRANCHES ON THE AGENT'S ANSWER
#   Every entry carries a `tag`, and apply branches on it:
#
#     a duplicate     →  closed as a duplicate, whatever its tag.
#     easy-call       →  `agent:implement`, which starts agent-implement.yml.
#                        The factory keeps going without being asked.
#     anything else   →  `needs-a-human`, and stop. Somebody has to look.
#
#   That is a real if/else on a value the agent chose, not a sentence in a
#   prompt asking it to be careful.
#
# THE LABELS WHILE IT RUNS
#   When the batch is listed, each issue swaps `agent:explore` for
#   `agent:in-progress`. Apply swaps `agent:in-progress` for the issue's next
#   label. If the run fails, finish marks every issue still in progress
#   `agent:blocked` with a comment linking the logs. Re-add `agent:explore` to
#   retry.
#
# THE AGENT
#   A Sandcastle script: .sandcastle/agent-workflows/explore/explore.ts, with
#   its prompt next to it in prompt.md.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN: the agent's auth token. To change the
#     agent or how it is billed, see
#     .sandcastle/agent-workflows/shared/common.ts.
#   secrets.FACTORY_PAT: the fine-grained PAT the whole factory uses. Every
#     call this workflow makes to GitHub uses it: listing the batch, fetching
#     the plan check, posting the findings, moving the labels, closing the
#     duplicates. One hop is why it exists at all: a label applied with the
#     built-in GITHUB_TOKEN starts no workflow, and `agent:implement` has to
#     start one.
#   secrets.GITHUB_TOKEN: supplied by Actions, and used only for the explore
#     job's checkout. Scoped per job below.
#   The `agent:explore` label. No workflow can create the label that starts
#     it; scripts/setup-factory.sh creates it once.
#
# A CAUTION THAT COMES WITH IT
#   `issues: labeled` fires on issues, which cannot come from a fork. Do not
#   copy this trigger onto `pull_request_target`.

on:
  issues:
    types: [labeled]

# One batch at a time, and never cancelled. A label that lands mid-run queues
# one more run behind this one, and that run lists the batch again when it
# starts. The issues this run took are `agent:in-progress` by then, so its
# batch is only what was labelled mid-run, and nothing is lost. Every other
# label, including the ones this run applies itself, gets a throwaway group of
# its own, so it can never bump that queued run.
concurrency:
  group: ${{ github.event.label.name == 'agent:explore' && 'agent-explore' || format('ignore-{0}', github.run_id) }}
  cancel-in-progress: false

# Nothing by default. The explore job asks for the read it needs.
permissions: {}

jobs:
  explore:
    # Every other label on every other issue stops here, for free.
    if: github.event.label.name == 'agent:explore'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read # the checkout. The tickets are read with FACTORY_PAT.

    # The batch it took, and the plan it came back with. Apply reads both.
    outputs:
      batch: ${{ steps.batch.outputs.numbers }}
      plan: ${{ steps.plan.outputs.json }}

    env:
      GH_REPO: ${{ github.repository }}
      # Claude Code and agent-browser. Only the agent's step puts this on its
      # PATH, as in agent-implement.yml.
      TOOLS_PREFIX: /home/runner/.factory-tools

    steps:
      - name: List the batch
        id: batch
        env:
          # The PAT, before the agent exists. Nothing after this step gets it.
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          set -euo pipefail
          # Labels often go on several at once. Let them all land.
          sleep 5

          # Titles and bodies are written by whoever opened the issue, so they
          # go straight into a file. They never pass through the shell or an
          # Actions expression. A comment goes in only when the person who
          # wrote it has write access to this repo, and is not one of the
          # factory's own status lines (they carry a hidden
          # `<!-- factory:status -->`).
          mkdir -p /tmp/explore
          gh issue list --state open --label "agent:explore" --limit 100 \
            --json number,title,body,createdAt,labels,comments \
            | jq 'map(.comments |= map(select(
                (.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))
                and (.body | contains("<!-- factory:status -->") | not))))' \
            > /tmp/explore/issues.json

          # Written before any label moves, so finish knows the batch even if
          # this step fails halfway through the loop below.
          numbers="$(jq -c '[.[].number] | sort' /tmp/explore/issues.json)"
          echo "Batch: $numbers"
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

          # The trigger comes off, so putting it back on is how you retry.
          # `agent:in-progress` stays on until apply moves the issue on.
          if [ "$numbers" != "[]" ]; then
            # The state labels may not exist yet. Existing ones are left as they are.
            gh label create "agent:in-progress" --color FBCA04 \
              --description "An agent is working on this right now" || true
            gh label create "agent:blocked" --color B60205 \
              --description "An agent run failed here. Its comment says how to retry" || true
          fi
          for n in $(jq -r '.[]' <<< "$numbers"); do
            gh issue edit "$n" --remove-label "agent:explore" || true
            gh issue edit "$n" --remove-label "agent:blocked" || true
            gh issue edit "$n" --add-label "agent:in-progress"
          done

      - name: Checkout
        if: steps.batch.outputs.numbers != '[]'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Setup pnpm
        if: steps.batch.outputs.numbers != '[]'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (version from .node-version)
        if: steps.batch.outputs.numbers != '[]'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.batch.outputs.numbers != '[]'
        run: pnpm install --frozen-lockfile

      - name: Week of the year
        # Refreshes the tools cache weekly, so Claude Code does not go stale.
        if: steps.batch.outputs.numbers != '[]'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Restore and save are split so the cache is saved right after the
      # install, before the agent runs. Same key as agent-implement.yml, so
      # every factory workflow shares one cache.
      - name: Restore Claude Code and agent-browser
        if: steps.batch.outputs.numbers != '[]'
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TOOLS_PREFIX }}
            ~/.agent-browser
          key: factory-tools-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Install Claude Code and agent-browser
        if: steps.batch.outputs.numbers != '[]' && steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm install -g --prefix "$TOOLS_PREFIX" @anthropic-ai/claude-code agent-browser
          "$TOOLS_PREFIX/bin/agent-browser" install

      - name: Save Claude Code and agent-browser
        if: steps.batch.outputs.numbers != '[]' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TOOLS_PREFIX }}
            ~/.agent-browser
          key: factory-tools-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Check the tools run
        if: steps.batch.outputs.numbers != '[]'
        run: |
          "$TOOLS_PREFIX/bin/claude" --version
          "$TOOLS_PREFIX/bin/agent-browser" --version

      - name: Explore
        # No GitHub token here, and no device or vendor credentials anywhere.
        # The plan comes back as plan.json, shaped by plan-schema.ts.
        if: steps.batch.outputs.numbers != '[]'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          PATH="$TOOLS_PREFIX/bin:$PATH" \
            pnpm exec tsx .sandcastle/agent-workflows/explore/explore.ts

      - name: Hand the plan to the apply job
        id: plan
        if: steps.batch.outputs.numbers != '[]'
        run: |
          set -euo pipefail
          # One line of JSON: newlines inside comments stay escaped.
          echo "json=$(jq -c . "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      - name: Hand the screenshots to the apply job
        if: steps.batch.outputs.numbers != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: explore-evidence
          path: /tmp/evidence/*.png
          if-no-files-found: ignore

  apply:
    needs: explore
    if: needs.explore.outputs.batch != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No checkout and no agent, so the GITHUB_TOKEN gets nothing. This job
    # writes with FACTORY_PAT.
    permissions: {}

    env:
      # On the job, which is fine here: nothing in it runs code from an agent
      # or from a checkout. It reads the plan as data, and runs one file
      # fetched from this commit.
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Take the screenshots from the explore job
        # A pattern, not a name, so a run with no screenshots finds nothing
        # and carries on.
        uses: actions/download-artifact@v4
        with:
          pattern: explore-evidence
          path: /tmp/evidence
          merge-multiple: true

      - name: Fetch the plan check
        # The one file the check needs, at the commit this run is for. It
        # imports nothing, so plain Node runs it without an install.
        run: |
          set -euo pipefail
          mkdir -p /tmp/plan-check
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/.sandcastle/agent-workflows/explore/plan-check.ts?ref=$GITHUB_SHA" \
            > /tmp/plan-check/plan-check.ts

      # Node 24 runs TypeScript as-is. Pinned here, not read from
      # .node-version, because there is no checkout to read it from.
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the plan
        env:
          # Through env, never pasted into the script. A `${{ }}` inside
          # `run:` is text bash runs, and the plan was written by an agent
          # that has just read a pile of untrusted issues.
          BATCH: ${{ needs.explore.outputs.batch }}
          PLAN: ${{ needs.explore.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > /tmp/plan.json
          [ -s /tmp/plan.json ] || { echo "::error::The explore run returned no plan."; exit 1; }
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { checkPlan } = await import(process.argv[1]);
            let plan;
            try {
              plan = JSON.parse(readFileSync(process.argv[2], "utf8"));
            } catch {
              plan = undefined;
            }
            const problems = checkPlan(JSON.parse(process.env.BATCH), plan);
            if (problems.length > 0) {
              console.log("::error::Refusing the plan. Nothing was written, and the finish job marks the batch agent:blocked.");
              for (const problem of problems) console.log(`::error::${problem}`);
              process.exit(1);
            }
          ' /tmp/plan-check/plan-check.ts /tmp/plan.json

      - name: Apply the plan
        # Every label below goes on with FACTORY_PAT, and that matters for
        # `agent:implement`: a label applied by the built-in token does not
        # fire `issues: labeled`, so agent-implement.yml would never wake up
        # and the chain would end here, silently, with a green tick.
        #
        # The findings comments are NOT tagged `<!-- factory:status -->`.
        # They are the one thing the implementer most needs to read.
        #
        # The plan passed the check, so every number below is an integer and
        # every tag is one this step knows.
        run: |
          set -euo pipefail
          # The state labels may not exist yet. Existing ones are left as they are.
          gh label create "needs-a-human" --color D93F0B \
            --description "Explore found open questions; settle them, then implement" || true

          # nullglob: an issue with no screenshots gets no --attach.
          shopt -s nullglob

          # Survivors first, so "closed as duplicate of #N" points at an issue
          # that already has its findings on it.
          for n in $(jq -r '.issues | sort_by([.duplicate_of != null, .number]) | .[].number' /tmp/plan.json); do
            entry="$(jq -c --argjson n "$n" '.issues[] | select(.number == $n)' /tmp/plan.json)"
            dup="$(jq -r '.duplicate_of // empty' <<< "$entry")"
            tag="$(jq -r '.tag' <<< "$entry")"

            if [ -n "$dup" ]; then
              next="Closed as duplicate of #$dup."
            elif [ "$tag" = "easy-call" ]; then
              next="Easy call. Handed to the implementer. Nobody is being asked first."
            else
              next="Stopped at \`$tag\`. Settle the open questions, then label \`agent:implement\` yourself."
            fi

            jq -r '.comment' <<< "$entry" > /tmp/comment.md
            printf '\n\n---\n\n_%s_ [Logs](%s)\n' "$next" "$RUN_URL" >> /tmp/comment.md
            # This issue's screenshots, /tmp/evidence/<n>-*.png. --attach
            # uploads them and swaps each path in the comment for its URL.
            attach=()
            for png in /tmp/evidence/"$n"-*.png; do attach+=(--attach "$png"); done
            gh issue comment "$n" --body-file /tmp/comment.md "${attach[@]}"

            # The branch. Every path takes `agent:in-progress` off: this
            # issue is done, and finish leaves it alone.
            if [ -n "$dup" ]; then
              gh issue edit "$n" --remove-label "agent:in-progress"
              gh api --method PATCH "repos/$GH_REPO/issues/$n" \
                -f state=closed -f state_reason=duplicate --silent
            elif [ "$tag" = "easy-call" ]; then
              gh issue edit "$n" \
                --remove-label "agent:in-progress" --add-label "agent:implement"
            else
              gh issue edit "$n" \
                --remove-label "agent:in-progress" --add-label "needs-a-human"
            fi
          done

  # The jobs above are one run, so the run's end is here: the same two label
  # steps that close every other agent workflow, over the whole batch.
  finish:
    needs: [explore, apply]
    if: always() && needs.explore.outputs.batch != '' && needs.explore.outputs.batch != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No checkout and no agent. It writes labels and comments with FACTORY_PAT.
    permissions: {}

    env:
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
      GH_REPO: ${{ github.repository }}
      BATCH: ${{ needs.explore.outputs.batch }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mark blocked on failure
        # A timeout or a cancelled run counts too: neither explored the batch.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          # Only the issues apply did not get to. One it did is already moved on.
          for n in $(jq -r '.[]' <<< "$BATCH"); do
            gh issue view "$n" --json labels --jq '.labels[].name' \
              | grep -qx "agent:in-progress" || continue
            gh issue edit "$n" --add-label "agent:blocked" || true
            # Tagged, so the next run on this issue leaves it out.
            gh issue comment "$n" --body \
              "Explore run **failed** — [logs](${RUN_URL}). Re-add \`agent:explore\` to retry. <!-- factory:status -->" \
              || true
          done

      - name: Always remove in-progress
        if: always()
        run: |
          for n in $(jq -r '.[]' <<< "$BATCH"); do
            gh issue edit "$n" --remove-label "agent:in-progress" || true
          done
